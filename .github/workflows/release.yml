name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            label: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            sidecar-triples: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          # Oldest supported LTS on purpose: the AppImage bundles WebKitGTK
          # but not glibc, so a build made on 24.04 needs glibc 2.39 on the
          # user's machine and fails to start on Ubuntu 22.04, Debian 12,
          # Mint 21 and RHEL 9. Built on 22.04 it needs glibc 2.35.
          - platform: ubuntu-22.04
            label: linux-x86_64
            rust-targets: x86_64-unknown-linux-gnu
            sidecar-triples: x86_64-unknown-linux-gnu
            tauri-args: ""
          - platform: windows-latest
            label: windows-x86_64
            rust-targets: x86_64-pc-windows-msvc
            sidecar-triples: x86_64-pc-windows-msvc
            tauri-args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Fetch ffmpeg sidecars (macOS universal — both arches)
        if: matrix.platform == 'macos-14'
        shell: bash
        run: FETCH_ALL=1 ./scripts/fetch-binaries.sh

      - name: Fetch ffmpeg sidecars (host triple)
        if: matrix.platform != 'macos-14'
        shell: bash
        run: ./scripts/fetch-binaries.sh

      - name: Verify sidecars are present and self-contained
        shell: bash
        run: |
          ls -la src-tauri/binaries
          ./scripts/check-binaries.sh

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Only publish a release for an actual v* tag. On workflow_dispatch
          # github.ref_name is the branch ("main"), which would otherwise
          # create a draft release tagged 'main'; leaving these empty makes a
          # dispatch run a pure build whose output is uploaded as artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bind it {0}', github.ref_name) || '' }}
          # Stays a draft until every platform has uploaded (see `publish`):
          # the three jobs finish minutes apart, and a non-draft release
          # becomes "latest" as soon as the first one creates it, so the
          # landing page's stable download links 404 for the other two.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}

      - name: Upload stable-named aliases to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # src-tauri/target is restored from cache, so an older version's
          # installer can sit next to the new one: match this version only.
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          case "${{ matrix.label }}" in
            macos-universal)
              SRC="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*_${VERSION}_*.dmg" | head -1)"
              DEST="Bind-it-macOS.dmg"
              ;;
            windows-x86_64)
              SRC="$(find src-tauri/target/release/bundle/msi -name "*_${VERSION}_*.msi" | head -1)"
              DEST="Bind-it-Windows.msi"
              # The per-user NSIS installer (no admin prompt) gets a stable name too.
              EXE="$(find src-tauri/target/release/bundle/nsis -name "*_${VERSION}_*-setup.exe" | head -1)"
              if [ -n "$EXE" ] && [ -f "$EXE" ]; then
                cp "$EXE" "Bind-it-Windows-setup.exe"
                gh release upload "${{ github.ref_name }}" "Bind-it-Windows-setup.exe" --clobber
              fi
              ;;
            linux-x86_64)
              SRC="$(find src-tauri/target/release/bundle/appimage -name "*_${VERSION}_*.AppImage" | head -1)"
              DEST="Bind-it-Linux.AppImage"
              ;;
          esac
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "No bundle found for ${{ matrix.label }}" >&2
            exit 1
          fi
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: bind-it-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app
          if-no-files-found: ignore

  # Publish only once all three platforms have uploaded their installers.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify every stable-named installer is attached, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for asset in Bind-it-macOS.dmg Bind-it-Windows.msi Bind-it-Linux.AppImage; do
            gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx "$asset" \
              || { echo "missing $asset on $TAG" >&2; exit 1; }
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false
