name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            label: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            sidecar-triples: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            label: linux-x86_64
            rust-targets: x86_64-unknown-linux-gnu
            sidecar-triples: x86_64-unknown-linux-gnu
            tauri-args: ""
          - platform: windows-latest
            label: windows-x86_64
            rust-targets: x86_64-pc-windows-msvc
            sidecar-triples: x86_64-pc-windows-msvc
            tauri-args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Fetch ffmpeg sidecars (macOS universal — both arches)
        if: matrix.platform == 'macos-14'
        shell: bash
        run: FETCH_ALL=1 ./scripts/fetch-binaries.sh

      - name: Fetch ffmpeg sidecars (host triple)
        if: matrix.platform != 'macos-14'
        shell: bash
        run: ./scripts/fetch-binaries.sh

      - name: Verify sidecars are present and self-contained
        shell: bash
        run: |
          ls -la src-tauri/binaries
          ./scripts/check-binaries.sh

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bind it ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}

      - name: Upload stable-named aliases to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          case "${{ matrix.label }}" in
            macos-universal)
              SRC="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)"
              DEST="Bind-it-macOS.dmg"
              ;;
            windows-x86_64)
              SRC="$(find src-tauri/target/release/bundle/msi -name '*.msi' | head -1)"
              DEST="Bind-it-Windows.msi"
              ;;
            linux-x86_64)
              SRC="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)"
              DEST="Bind-it-Linux.AppImage"
              ;;
          esac
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "No bundle found for ${{ matrix.label }}" >&2
            exit 1
          fi
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: bind-it-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app
          if-no-files-found: ignore
