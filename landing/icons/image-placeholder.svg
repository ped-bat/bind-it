<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 538" role="img" aria-label="Bindery app preview">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#EDE9E1"/>
    </linearGradient>
    <linearGradient id="cover-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4893A"/>
      <stop offset="1" stop-color="#8B5A26"/>
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect width="860" height="538" fill="url(#bg-g)"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="860" height="44" fill="#E6E2DA"/>
  <circle cx="22" cy="22" r="6" fill="#EC6A5F"/>
  <circle cx="42" cy="22" r="6" fill="#F5BF4F"/>
  <circle cx="62" cy="22" r="6" fill="#61C554"/>
  <text x="430" y="27" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#5F5A54" font-weight="600">Bindery</text>

  <!-- Left column: cover + metadata -->
  <g transform="translate(32,72)">
    <!-- Cover -->
    <rect x="0" y="0" width="200" height="200" rx="10" fill="url(#cover-g)"/>
    <text x="100" y="104" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#FFF2E0" opacity="0.9">Cover Art</text>

    <!-- Metadata rows -->
    <g font-family="-apple-system, Inter, sans-serif" fill="#5F5A54">
      <text x="0" y="234" font-size="11" font-weight="700" letter-spacing="1" fill="#928C84">TITLE</text>
      <rect x="0" y="244" width="200" height="28" rx="6" fill="#FFF" stroke="#E2DFD9"/>
      <text x="10" y="263" font-size="13" fill="#1A1918" font-weight="600">The Silent Shore</text>

      <text x="0" y="296" font-size="11" font-weight="700" letter-spacing="1" fill="#928C84">AUTHOR</text>
      <rect x="0" y="306" width="200" height="28" rx="6" fill="#FFF" stroke="#E2DFD9"/>
      <text x="10" y="325" font-size="13" fill="#1A1918">M. Halvorsen</text>

      <text x="0" y="358" font-size="11" font-weight="700" letter-spacing="1" fill="#928C84">BITRATE</text>
      <rect x="0" y="368" width="200" height="28" rx="6" fill="#FFF" stroke="#E2DFD9"/>
      <text x="10" y="387" font-size="13" fill="#1A1918">128 kbps</text>
    </g>
  </g>

  <!-- Right column: chapter list -->
  <g transform="translate(268,72)">
    <rect x="0" y="0" width="560" height="380" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>

    <!-- Header row -->
    <text x="20" y="28" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#928C84">CHAPTERS · 12</text>
    <text x="540" y="28" text-anchor="end" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#928C84">06:42:15</text>
    <line x1="0" y1="44" x2="560" y2="44" stroke="#EEEAE2"/>

    <!-- Chapter rows -->
    <g font-family="-apple-system, Inter, sans-serif">
      <!-- Row template repeated -->
      <g transform="translate(0,44)">
        <rect width="560" height="44" fill="#FAF7F1"/>
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">01</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Prologue — The Harbour</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">12:04</text>
      </g>
      <g transform="translate(0,88)">
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">02</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter One — First Light</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">28:31</text>
      </g>
      <g transform="translate(0,132)">
        <rect width="560" height="44" fill="#FAF7F1"/>
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">03</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter Two — A Slow Tide</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">34:18</text>
      </g>
      <g transform="translate(0,176)">
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">04</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter Three — The Lantern</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">41:02</text>
      </g>
      <g transform="translate(0,220)">
        <rect width="560" height="44" fill="#FAF7F1"/>
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">05</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter Four — Tidelines</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">29:47</text>
      </g>
      <g transform="translate(0,264)">
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">06</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter Five — Wreckage</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">36:55</text>
      </g>
      <g transform="translate(0,308)">
        <rect width="560" height="44" fill="#FAF7F1"/>
        <text x="20" y="27" font-size="12" fill="#928C84" font-variant-numeric="tabular-nums">07</text>
        <text x="56" y="27" font-size="14" fill="#1A1918" font-weight="500">Chapter Six — Salt and Iron</text>
        <text x="540" y="27" text-anchor="end" font-size="12" fill="#5F5A54" font-variant-numeric="tabular-nums">33:20</text>
      </g>
    </g>
  </g>

  <!-- Bind button -->
  <g transform="translate(268,472)">
    <rect width="560" height="44" rx="10" fill="#1A1918"/>
    <text x="280" y="28" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#FAFAF8">Bind → audiobook.m4b</text>
  </g>
</svg>
