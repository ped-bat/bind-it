[package]
name = "bind-it"
version = "1.0.0"
description = "Bind audio files into a single M4B"
authors = ["Pedro Batista <me@pedrobatista.pt>"]
license = "MIT"
edition = "2021"
default-run = "bind-it"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bind_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Dev-only batch CLI. Gated behind a feature so `tauri build` never compiles
# it — an ungated bin lands inside the shipped .app bundle.
cli = []

[[bin]]
name = "bind-it-cli"
path = "src/bin/bind-it-cli.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
regex = "1"
rayon = "1"
num_cpus = "1"

